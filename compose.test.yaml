# Disposable local test database. Never point integration tests at operational data.
name: wos-tests
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: scheduler_test
      POSTGRES_USER: scheduler_test
      POSTGRES_PASSWORD: ${WOS_TEST_DB_PASSWORD:?Provide a local test password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler_test -d scheduler_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Test data is intentionally ephemeral and disappears when this container is removed.
    tmpfs:
      - /var/lib/postgresql/data
