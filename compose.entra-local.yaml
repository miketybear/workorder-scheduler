name: workorder-scheduler-entra-local
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: scheduler_entra_local
      POSTGRES_USER: scheduler_entra_local
      POSTGRES_PASSWORD: ${WOS_LOCAL_DB_PASSWORD:?Set password in .cache/entra-local-db.env}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - entra_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler_entra_local -d scheduler_entra_local"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  entra_local_data:
