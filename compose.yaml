# Local foundation only: HTTP is bound to loopback. HTTPS/SSO production deployment is pending.
name: workorder-scheduler
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build: ./backend
    environment: &backend_environment
      WOS_ENVIRONMENT: development
      WOS_DATABASE_URL: ${WOS_DATABASE_URL:?Set URL with matching database credentials in .env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    environment: *backend_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
