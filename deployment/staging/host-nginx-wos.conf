# Site for a shared host nginx that already owns :443 and routes by server_name.
# WOS web nginx stays the TLS endpoint on 127.0.0.1:9443 (WOS_WEB_PUBLISH); this hop
# re-encrypts to it. Timeouts match deployment/staging/nginx.conf (read budget 300s).
server {
    listen 10.17.31.187:443 ssl;
    server_name wos.biendongpoc.vn;

    ssl_certificate     /etc/nginx/ssl/fullchain-0926.pem;
    ssl_certificate_key /etc/nginx/ssl/server-0926.key;

    client_max_body_size 2m;
    access_log off;

    location / {
        proxy_pass https://127.0.0.1:9443;
        proxy_ssl_server_name on;
        proxy_ssl_name wos.biendongpoc.vn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 310s;
    }
}
