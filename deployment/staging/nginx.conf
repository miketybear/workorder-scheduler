# Direct TLS ingress. Backend ignores forwarded headers; no additional TLS proxy.
worker_processes auto;
# Drain active proxy requests before Docker's 330s stop deadline.
worker_shutdown_timeout 320s;
error_log /dev/null;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Error logs may include request query/headers. Use status-only access logs
    # and health/uptime monitoring until a redacted error-log pipeline is approved.
    log_format safe_path '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log safe_path;
    server_tokens off;
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        client_max_body_size 1m;
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            # Read/draft handlers share an outer budget of at most 300s (default180).
            # Cancellation cleanup is cooperative; measure it on Ubuntu staging.
            proxy_read_timeout 310s;
            proxy_next_upstream off;
        }
        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header X-Frame-Options DENY always;
            add_header Cache-Control no-store always;
            try_files $uri $uri/ /index.html;
        }
    }
}
